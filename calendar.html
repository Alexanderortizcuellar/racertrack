<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Racer Calendar | Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Include Google Fonts and FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
      :root {
        --bg-page: #0d1117;
        --bg-card: #161b22;
        --bg-subtle: #1c2333;
        --bg-input: #1c2333;
        --bg-chip: #21262d;
        --border: #30363d;
        --border-subtle: #21262d;
        --text-heading: #f0f6fc;
        --text-body: #c9d1d9;
        --text-muted: #8b949e;
        --text-faint: #6e7681;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --success: #10b981;
        --radius: 12px;
      }

      body {
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-body);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        background: var(--bg-card);
        width: 100%;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        padding: 16px 0;
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
      }

      .header-container {
        width: 90%;
        max-width: 1000px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }

      .header-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-icon {
        font-size: 20px;
        color: var(--primary);
        background: var(--bg-subtle);
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      h2 {
        margin: 0;
        color: var(--text-heading);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-btn {
        background: var(--bg-chip);
        color: var(--text-heading);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .nav-btn:hover {
        background: var(--bg-subtle);
        border-color: var(--primary);
        color: var(--primary);
      }

      select {
        background: var(--bg-chip);
        color: var(--text-heading);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: all 0.2s ease;
      }

      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
      }

      .dashboard-link {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .dashboard-link:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      main {
        width: 90%;
        max-width: 1000px;
        margin: 30px auto;
        animation: fadeIn 0.4s ease-out;
      }

      #calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
        background: var(--bg-card);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
      }

      .day-header {
        font-weight: 700;
        color: var(--text-muted);
        text-align: center;
        padding: 10px 0;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .day {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: default;
      }

      .day.empty-slot {
        background: transparent;
        border: none;
        pointer-events: none;
      }

      .day.has-data {
        cursor: pointer;
        border-color: rgba(59, 130, 246, 0.2);
        background: linear-gradient(135deg, var(--bg-subtle) 0%, rgba(28, 35, 51, 0.8) 100%);
      }

      .day.has-data:hover {
        transform: translateY(-4px) scale(1.02);
        border-color: var(--primary);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
        background: var(--bg-chip);
      }

      .day.is-today {
        border: 2px solid var(--primary) !important;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }

      .day.is-today::after {
        content: 'TODAY';
        position: absolute;
        top: -8px;
        right: 8px;
        background: var(--primary);
        color: white;
        font-size: 8px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 4px;
        letter-spacing: 0.5px;
      }

      .date {
        font-size: 0.85em;
        font-weight: 700;
        color: var(--text-muted);
        align-self: flex-start;
      }

      .day.has-data .date {
        color: var(--text-heading);
      }

      .avg-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
      }

      .avg {
        font-size: 1.4em;
        font-weight: 800;
        color: var(--text-faint);
      }

      .day.has-data .avg {
        font-size: 1.5em;
      }

      .label-score {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-faint);
        font-weight: 600;
        margin-top: 2px;
      }

      /* Activity Indicator dot */
      .indicator {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: transparent;
      }

      .day.has-data .indicator {
        background: var(--primary);
        box-shadow: 0 0 6px var(--primary);
      }

      /* Tooltip styling */
      .tooltip {
        position: fixed;
        background: rgba(22, 27, 34, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 13px;
        color: var(--text-body);
        pointer-events: none;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 1000;
        min-width: 210px;
      }

      .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tooltip-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-heading);
        margin-bottom: 10px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tooltip-title i {
        color: var(--primary);
      }

      .tooltip-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-weight: 500;
      }

      .tooltip-row span:first-child {
        color: var(--text-muted);
      }

      .tooltip-row span:last-child {
        color: var(--text-heading);
        font-weight: 600;
      }

      /* Key Legend */
      .legend-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 20px;
        margin-top: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .legend-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .legend {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-body);
        font-weight: 500;
      }

      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Selected day highlight styling */
      .day.selected {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3) !important;
        transform: translateY(-2px) scale(1.02);
        z-index: 2;
      }

      /* Day details card styling */
      .details-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        animation: fadeIn 0.3s ease-out;
      }
      .details-card.hidden {
        display: none;
      }
      .details-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 16px;
      }
      .details-date {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-heading);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .details-date i {
        color: var(--primary);
      }
      .close-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 20px;
        cursor: pointer;
        transition: color 0.2s;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        width: 28px;
        height: 28px;
      }
      .close-btn:hover {
        color: var(--text-heading);
        background: var(--bg-subtle);
      }
      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .details-stat {
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .details-stat-label {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .details-stat-value {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-heading);
      }
      .details-footer {
        margin-top: 16px;
      }
      .details-footer .dashboard-link {
        width: 100%;
        box-sizing: border-box;
        justify-content: center;
      }

      /* Day short label for headers */
      .day-short {
        display: none;
      }

      /* Responsive styling (Mobile & Tablet) */
      @media (max-width: 768px) {
        .header-container {
          flex-direction: column;
          align-items: stretch;
          text-align: center;
          gap: 12px;
        }
        .header-title-group {
          justify-content: center;
        }
        .controls {
          justify-content: center;
          flex-wrap: wrap;
          width: 100%;
          gap: 8px;
        }
        .controls select {
          flex: 1;
          min-width: 80px;
          height: 38px;
        }
        .nav-btn {
          height: 38px;
          width: 38px;
        }
        .dashboard-link {
          width: 100%;
          justify-content: center;
          box-sizing: border-box;
          height: 38px;
          margin-top: 4px;
        }
        main {
          margin: 16px auto;
          width: 95%;
        }
        #calendar {
          gap: 8px;
          padding: 14px;
        }
        .day {
          padding: 10px 8px;
          min-height: 80px;
        }
        .avg {
          font-size: 1.2em !important;
        }
        .label-score {
          display: none;
        }
        .legend-card {
          padding: 14px;
          margin-top: 16px;
        }
        .legend {
          gap: 12px;
        }
      }

      /* Mobile Portrait Small screens */
      @media (max-width: 550px) {
        .day-long {
          display: none;
        }
        .day-short {
          display: inline;
        }
        #calendar {
          gap: 5px;
          padding: 8px;
          border-radius: 12px;
        }
        .day {
          aspect-ratio: 1 / 1;
          min-height: unset;
          padding: 4px;
          justify-content: center;
          align-items: center;
        }
        .day.has-data {
          background: var(--day-bg-subtle) !important;
          border-color: var(--day-color) !important;
          border-width: 1.5px;
        }
        .day.is-today::after {
          font-size: 6px;
          padding: 1px 3px;
          top: -5px;
          right: 1px;
          border-radius: 2px;
        }
        .day .avg-container {
          display: none;
        }
        .day .indicator {
          display: none;
        }
        .day .date {
          align-self: center;
          font-size: 13px;
          font-weight: 700;
        }
        .details-grid {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .details-stat {
          padding: 8px 12px;
        }
        .details-stat[style*="grid-column"] {
          grid-column: span 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="header-title-group">
          <div class="header-icon">
            <i class="fa-regular fa-calendar-days"></i>
          </div>
          <div>
            <h2>Racer Calendar</h2>
          </div>
        </div>
        <div class="controls">
          <button id="prevMonth" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <select id="monthSelect"></select>
          <select id="yearSelect"></select>
          <button id="nextMonth" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
          <a href="index.html" class="dashboard-link">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
          </a>
        </div>
      </div>
    </header>

    <main>
      <div id="calendar"></div>

      <!-- Day Details Card (dynamically populated on mobile/tablet) -->
      <div id="details-card" class="details-card hidden">
        <div class="details-header">
          <div class="details-date">
            <i class="fa-solid fa-calendar-day"></i>
            <span id="details-date-text"></span>
          </div>
          <button id="close-details" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="details-body" id="details-body-content"></div>
        <div class="details-footer">
          <a id="details-dashboard-link" href="#" class="dashboard-link">
            <i class="fa-solid fa-chart-pie"></i> View Detailed Dashboard
          </a>
        </div>
      </div>

      <div class="legend-card">
        <div class="legend-title">Average Score Performance Color Legend</div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background-color: hsl(0, 85%, 60%);"></div>
            <span>Needs Practice (&lt; 10)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: hsl(35, 85%, 60%);"></div>
            <span>Average (10 - 15)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: hsl(60, 85%, 60%);"></div>
            <span>Good (15 - 20)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: hsl(120, 85%, 60%);"></div>
            <span>Excellent (&gt;= 25)</span>
          </div>
        </div>
      </div>
    </main>

    <div id="tooltip" class="tooltip"></div>

    <script>
      async function loadRacers() {
        const res = await fetch("data/racers.json");
        const racers = await res.json();
        return racers;
      }

      function groupByDate(racers) {
        const grouped = {};
        racers.forEach((r) => {
          if (!grouped[r.date]) grouped[r.date] = [];
          grouped[r.date].push(r);
        });
        return grouped;
      }

      function calculateAverages(grouped) {
        const averages = {};
        for (const date in grouped) {
          const racers = grouped[date];
          const total = racers.reduce((sum, r) => sum + (r.score || 0), 0);
          averages[date] = total / racers.length;
        }
        return averages;
      }

      function getAvgColor(avg) {
        // Map average score from 0 (red) to 25+ (green/emerald)
        // Ratio: 0 maps to 0% of range, 25 maps to 100% of range
        const maxScore = 25;
        const ratio = Math.min(Math.max(avg / maxScore, 0), 1);
        const hue = ratio * 120; // 0 (red) to 120 (green)
        return `hsl(${hue}, 85%, 60%)`;
      }

      function computeTooltipStats(racers) {
        const totalRacers = racers.length;
        let totalPuzzles = 0;
        let solved = 0;
        let unsolved = 0;
        let totalScore = 0;
        let totalRating = 0;
        let fastest = Infinity;

        racers.forEach((r) => {
          totalPuzzles += r.puzzles_done || 0;
          totalScore += r.score || 0;
          r.puzzles?.forEach((p) => {
            if (p.solved) solved++;
            else unsolved++;
            totalRating += p.rating || 0;
            if (p.time && p.time < fastest) fastest = p.time;
          });
        });

        const avgScore = (totalScore / totalRacers).toFixed(1);
        const avgRating = (totalRating / (solved + unsolved || 1)).toFixed(0);

        return `
          <div class="tooltip-row"><span>Racers:</span><span>${totalRacers}</span></div>
          <div class="tooltip-row"><span>Total Puzzles:</span><span>${totalPuzzles}</span></div>
          <div class="tooltip-row"><span>Solved:</span><span>${solved}</span></div>
          <div class="tooltip-row"><span>Unsolved:</span><span>${unsolved}</span></div>
          <div class="tooltip-row"><span>Avg Score:</span><span>${avgScore}</span></div>
          <div class="tooltip-row"><span>Avg Rating:</span><span>${avgRating}</span></div>
          <div class="tooltip-row"><span>Fastest Time:</span><span>${fastest === Infinity ? "-" : fastest + "s"}</span></div>
        `;
      }

      function populatePickers(year, month) {
        const monthSelect = document.getElementById("monthSelect");
        const yearSelect = document.getElementById("yearSelect");

        const months = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        monthSelect.innerHTML = months
          .map(
            (m, i) =>
              `<option value="${i}" ${
                i === month ? "selected" : ""
              }>${m}</option>`
          )
          .join("");

        const currentYear = new Date().getFullYear();
        const years = [];
        for (let y = currentYear - 3; y <= currentYear + 1; y++) {
          years.push(
            `<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`
          );
        }
        yearSelect.innerHTML = years.join("");
      }

      function showDetailsCard(dateStr, dayRacers, year, month, d) {
        const detailsCard = document.getElementById("details-card");
        const detailsDateText = document.getElementById("details-date-text");
        const detailsBodyContent = document.getElementById("details-body-content");
        const detailsDashboardLink = document.getElementById("details-dashboard-link");

        const dateObj = new Date(year, month, d);
        const formattedDate = dateObj.toLocaleDateString(undefined, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        detailsDateText.textContent = formattedDate;
        detailsDashboardLink.href = `index.html?start=${dateStr}&end=${dateStr}`;

        const totalRacers = dayRacers.length;
        let totalPuzzles = 0;
        let solved = 0;
        let unsolved = 0;
        let totalScore = 0;
        let totalRating = 0;
        let fastest = Infinity;

        dayRacers.forEach((r) => {
          totalPuzzles += r.puzzles_done || 0;
          totalScore += r.score || 0;
          r.puzzles?.forEach((p) => {
            if (p.solved) solved++;
            else unsolved++;
            totalRating += p.rating || 0;
            if (p.time && p.time < fastest) fastest = p.time;
          });
        });

        const avgScore = (totalScore / totalRacers).toFixed(1);
        const avgRating = (totalRating / (solved + unsolved || 1)).toFixed(0);
        const avgColor = getAvgColor(parseFloat(avgScore));

        detailsBodyContent.innerHTML = `
          <div class="details-grid">
            <div class="details-stat">
              <span class="details-stat-label">Racers</span>
              <span class="details-stat-value">${totalRacers}</span>
            </div>
            <div class="details-stat">
              <span class="details-stat-label">Total Puzzles</span>
              <span class="details-stat-value">${totalPuzzles}</span>
            </div>
            <div class="details-stat">
              <span class="details-stat-label">Solved</span>
              <span class="details-stat-value" style="color: var(--success);">${solved}</span>
            </div>
            <div class="details-stat">
              <span class="details-stat-label">Unsolved</span>
              <span class="details-stat-value" style="color: #ef4444;">${unsolved}</span>
            </div>
            <div class="details-stat">
              <span class="details-stat-label">Avg Score</span>
              <span class="details-stat-value" style="color: ${avgColor}; text-shadow: 0 0 8px ${avgColor}44;">${avgScore}</span>
            </div>
            <div class="details-stat">
              <span class="details-stat-label">Avg Rating</span>
              <span class="details-stat-value">${avgRating}</span>
            </div>
            <div class="details-stat" style="grid-column: span 2;">
              <span class="details-stat-label">Fastest Time</span>
              <span class="details-stat-value">${fastest === Infinity ? "-" : fastest + "s"}</span>
            </div>
          </div>
        `;
        
        detailsCard.classList.remove("hidden");
        // Scroll only if width is small to avoid unwanted jump on desktop
        if (window.innerWidth <= 768) {
          detailsCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function generateCalendar(grouped, averages, year, month) {
        const calendar = document.getElementById("calendar");
        const tooltip = document.getElementById("tooltip");
        calendar.innerHTML = "";

        const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const daysShort = ["S", "M", "T", "W", "T", "F", "S"];
        daysOfWeek.forEach((day, idx) => {
          const div = document.createElement("div");
          div.className = "day-header";
          div.innerHTML = `<span class="day-long">${day}</span><span class="day-short">${daysShort[idx]}</span>`;
          calendar.appendChild(div);
        });

        const start = new Date(year, month, 1);
        const end = new Date(year, month + 1, 0);
        const firstDay = start.getDay();
        const daysInMonth = end.getDate();

        for (let i = 0; i < firstDay; i++) {
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "day empty-slot";
          calendar.appendChild(emptyDiv);
        }

        const todayDateObj = new Date();
        const isTodayYearMonth = todayDateObj.getFullYear() === year && todayDateObj.getMonth() === month;

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(
            2,
            "0"
          )}-${String(d).padStart(2, "0")}`;
          
          const div = document.createElement("div");
          div.className = "day";
          if (isTodayYearMonth && todayDateObj.getDate() === d) {
            div.classList.add("is-today");
          }

          const hasData = !!grouped[dateStr];

          if (!hasData) {
            div.innerHTML = `
              <div class="date">${d}</div>
              <div class="avg-container">
                <div class="avg">-</div>
              </div>
            `;
          } else {
            div.classList.add("has-data");
            const avgVal = averages[dateStr];
            const avgColor = getAvgColor(avgVal);
            
            // Set CSS variables on the day card for responsive styling
            div.style.setProperty('--day-color', avgColor);
            const hue = Math.min(Math.max(avgVal / 25, 0), 1) * 120;
            div.style.setProperty('--day-bg-subtle', `hsla(${hue}, 85%, 60%, 0.15)`);

            div.innerHTML = `
              <div class="date">${d}</div>
              <div class="avg-container">
                <div class="avg" style="color: ${avgColor}; text-shadow: 0 0 12px ${avgColor}33;">${avgVal.toFixed(1)}</div>
                <div class="label-score">avg</div>
              </div>
              <div class="indicator" style="background-color: ${avgColor}; box-shadow: 0 0 8px ${avgColor};"></div>
            `;

            div.addEventListener("click", () => {
              if (window.innerWidth <= 768) {
                if (div.classList.contains("selected")) {
                  // Second click/tap goes to the dashboard page
                  window.location.href = `index.html?start=${dateStr}&end=${dateStr}`;
                } else {
                  // Select day and display the details panel
                  document.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
                  div.classList.add("selected");
                  showDetailsCard(dateStr, grouped[dateStr], year, month, d);
                }
              } else {
                // Desktop goes straight to dashboard
                window.location.href = `index.html?start=${dateStr}&end=${dateStr}`;
              }
            });

            div.addEventListener("mousemove", (e) => {
              // Hide tooltip on touch devices/mobile sizes
              if (window.innerWidth <= 768) return;

              tooltip.innerHTML = `
                <div class="tooltip-title">
                  <i class="fa-solid fa-calendar-day"></i> ${new Date(year, month, d).toLocaleDateString(undefined, { dateStyle: 'medium' })}
                </div>
                ${computeTooltipStats(grouped[dateStr])}
              `;
              tooltip.classList.add("visible");

              const mouseX = e.clientX + 15;
              const mouseY = e.clientY + 10;
              const tooltipRect = tooltip.getBoundingClientRect();

              let left = mouseX;
              let top = mouseY;

              // Prevent overflow on right
              if (left + tooltipRect.width > window.innerWidth) {
                left = e.clientX - tooltipRect.width - 15;
              }
              // Prevent overflow on bottom
              if (top + tooltipRect.height > window.innerHeight) {
                top = e.clientY - tooltipRect.height - 15;
              }

              tooltip.style.left = `${left}px`;
              tooltip.style.top = `${top}px`;
            });

            div.addEventListener("mouseleave", () => {
              tooltip.classList.remove("visible");
            });
          }

          calendar.appendChild(div);
        }
      }

      async function init() {
        const racers = await loadRacers();
        const grouped = groupByDate(racers);
        const averages = calculateAverages(grouped);

        let current = new Date();
        let year = current.getFullYear();
        let month = current.getMonth();

        populatePickers(year, month);
        generateCalendar(grouped, averages, year, month);

        // Register close button for details card
        document.getElementById("close-details").addEventListener("click", () => {
          document.getElementById("details-card").classList.add("hidden");
          document.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
        });

        const hideDetails = () => {
          document.getElementById("details-card").classList.add("hidden");
        };

        document
          .getElementById("monthSelect")
          .addEventListener("change", (e) => {
            month = parseInt(e.target.value);
            hideDetails();
            generateCalendar(grouped, averages, year, month);
          });

        document
          .getElementById("yearSelect")
          .addEventListener("change", (e) => {
            year = parseInt(e.target.value);
            hideDetails();
            generateCalendar(grouped, averages, year, month);
          });

        document.getElementById("prevMonth").addEventListener("click", () => {
          if (month === 0) {
            month = 11;
            year--;
          } else month--;
          populatePickers(year, month);
          hideDetails();
          generateCalendar(grouped, averages, year, month);
        });

        document.getElementById("nextMonth").addEventListener("click", () => {
          if (month === 11) {
            month = 0;
            year++;
          } else month++;
          populatePickers(year, month);
          hideDetails();
          generateCalendar(grouped, averages, year, month);
        });
      }

      init();
    </script>
  </body>
</html>
